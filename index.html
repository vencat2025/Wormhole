<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <title>Simple Image Display</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    img { max-width:90%; max-height:90%; }
  </style>
</head>
<body>
  <!-- A small red dot PNG (1x1) encoded as data URI -->
  <img src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+V0b0AAAAASUVORK5CYII=' alt='Red Dot'>
</body>
</html>
