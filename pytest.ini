# The tests import the gateway's top-level modules -- config, db, main,
# services -- as bare names, which only works when the repository root is on
# the import path. `python -m pytest` puts the current directory there; bare
# `pytest` does not. CI ran the bare form and failed on every test with
# ModuleNotFoundError for two weeks while the local runs, which used the other
# form, stayed green. This makes both forms behave the same.
[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
